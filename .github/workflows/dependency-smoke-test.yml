name: Dependency Smoke Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux-smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install OS dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0t64

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Smoke test critical imports
        run: |
          python -c "import cv2; import mediapipe as mp; import streamlit; import sklearn; import numpy; import pandas; print('Smoke test passed')"
